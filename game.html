
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101310">
  <meta name="description" content="Play chess on Chessington.">
  <title>Chessington — Chess Game</title>

  <link rel="stylesheet" href="game.css">
</head>

<body>
  <header class="game-header">
    <a class="brand" href="index.html">
      <span class="brand-icon">♞</span>
      <span>Chessington</span>
    </a>

    <a class="home-link" href="index.html">← Home</a>
  </header>

  <div class="app-layout">

  <aside class="mode-sidebar">
    <a class="sidebar-brand" href="index.html">
      <span>♞</span> Chessington
    </a>

    <p class="sidebar-heading">PLAY</p>

    <nav class="mode-navigation">
      <button class="mode-button" data-mode="online">
        <span class="mode-icon">🌐</span>
        <span>Online Play</span>
        <span class="coming-soon">Soon</span>
      </button>

      <button class="mode-button active" data-mode="computer">
        <span class="mode-icon">♟</span>
        <span>Play Computer</span>
      </button>

      <button class="mode-button" data-mode="practice">
        <span class="mode-icon">♙</span>
        <span>Practice</span>
      </button>
    </nav>

    <div class="sidebar-bottom">
      <a href="index.html">← Back to Home</a>
    </div>
  </aside>

  <main class="game-layout">
    
    <section class="board-section">
      <div class="game-heading">
        <p class="eyebrow">YOUR NEXT MOVE</p>
        <h1>Let's play chess.</h1>
      </div>

      <div class="player-label">
        <span class="player-icon">♚</span>
        <span>Black</span>
        <span class="player-turn" id="black-turn"></span>
      </div>

      <div class="board-frame">
        <div class="board" id="game-board"></div>
      </div>

      <div class="player-label bottom-player">
        <span class="player-icon">♔</span>
        <span>White</span>
        <span class="player-turn" id="white-turn"></span>
      </div>
    </section>

    <aside class="game-sidebar">

      <div class="status-card">
        <p class="eyebrow">GAME STATUS</p>
        <h2 id="game-status">White to move</h2>
        <p id="status-description">Select a piece to begin.</p>
      </div>

      <div class="history-card">
        <div class="card-heading">
          <h2>Move history</h2>
          <span id="move-count">0 moves</span>
        </div>

        <div class="move-history" id="move-history">
          <p class="empty-history">Your moves will appear here.</p>
        </div>
      </div>

      <div class="settings-card">
        <label for="promotion-choice">Pawn promotion</label>
        <select id="promotion-choice">
          <option value="q">Queen</option>
          <option value="r">Rook</option>
          <option value="b">Bishop</option>
          <option value="n">Knight</option>
        </select>
      </div>

      <div class="game-actions">
        <button class="new-game-button" id="new-game">New game</button>
        <button class="secondary-button" id="undo-move">Undo move</button>
      </div>

    </aside>

  </main>
    </div>

  <footer class="game-footer">
    <span>CHESSINGTON</span>
    <span>MADE FOR THE LOVE OF CHESS ♟</span>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
